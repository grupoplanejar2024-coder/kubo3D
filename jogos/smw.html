<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario World - Kubo Touch</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-container {
            width: 100%;
            max-width: 800px;
            height: 450px;
            display: none;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        .btn-play {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        .btn-play:hover {
            background-color: #c0392b;
        }
        #game-card {
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-card">
        <h1>Super Mario World</h1>
        <p>Toque abaixo para iniciar o jogo pelo Kubo Touch</p>
        <button class="btn-play" onclick="startEmulator()">▶ JOGAR AGORA</button>
    </div>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script>
        function startEmulator() {
            document.getElementById('game-card').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';

            // Configurações do EmulatorJS otimizadas para Mobile / NFC
            window.EJS_player = "#game";
            window.EJS_core = "snes9x2010";         // Core estável e leve para telemóveis
            window.EJS_gameName = "Super Mario World";
            window.EJS_color = "#e74c3c";
            window.EJS_startOnLoaded = true;
            window.EJS_threads = false;            // Desativa threads pesadas para evitar travamentos
            window.EJS_disableDatabases = true;   // Evita problemas de cache no navegador móvel

            // Caminho estável oficial do EmulatorJS (Elimina o Network Error)
            window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            
            // Link direto da ROM hospedada no seu GitHub
            window.EJS_gameUrl = "https://cdn.jsdelivr.net/gh/grupoplanejar2024-coder/kubo3D@main/roms/smw.sfc";

            let script = document.createElement("script");
            script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
            document.body.appendChild(script);
        }
    </script>

</body>
</html>
