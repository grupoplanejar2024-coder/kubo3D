
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario World - Kubo Touch</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-card {
            text-align: center;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 350px;
        }
        #game-card img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #000;
            display: none;
            z-index: 999;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        .btn-play {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        .btn-play:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <!-- CARTÃO DO JOGO COM A CAPA E O BOTÃO -->
    <div id="game-card">
        <!-- Substitua abaixo o link da imagem se a sua capa estiver numa pasta específica, ex: ../imagens/smw.jpg -->
        <img src="../imagens/smw.jpg" alt="Capa Super Mario World">
        <h2>Super Mario World</h2>
        <button class="btn-play" onclick="startEmulator()">▶ JOGAR AGORA</button>
    </div>

    <!-- CONTENTOR DO EMULADOR -->
    <div id="game-container">
        <div id="game"></div>
    </div>

    <script>
        function startEmulator() {
            document.getElementById('game-card').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';

            // Configurações do EmulatorJS otimizadas para Mobile / NFC
            window.EJS_player = "#game";
            window.EJS_core = "snes9x2010";         // Core leve e estável para telemóveis
            window.EJS_gameName = "Super Mario World";
            window.EJS_color = "#e74c3c";
            window.EJS_startOnLoaded = true;
            window.EJS_threads = false;            // Desativa threads para evitar travamentos
            window.EJS_disableDatabases = true;   // Evita erros de cache no navegador móvel

            // Caminho da CDN oficial (Elimina o Network Error)
            window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            
            // Link direto da ROM hospedada no seu repositório GitHub
            window.EJS_gameUrl = "https://cdn.jsdelivr.net/gh/grupoplanejar2024-coder/kubo3D@main/roms/smw.sfc";

            let script = document.createElement("script");
            script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
            document.body.appendChild(script);
        }
    </script>

</body>
</html>
