<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Super Mario World - Kubo Touch</title>
    <style>
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation; 
        }
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #121212; 
            color: #fff; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        header { text-align: center; padding: 15px; background: #1e1e1e; border-bottom: 2px solid #333; }
        .badge { background: #e74c3c; color: #fff; padding: 4px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; letter-spacing: 1px; }
        #game-card { max-width: 500px; margin: 20px auto; background: #1e1e1e; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .cover-container { 
            width: 100%; 
            height: 260px; 
            background-image: url('../imagens/supermarioworld-cover.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
        }
        
        .content { padding: 20px; }
        h1 { margin: 0 0 10px 0; font-size: 24px; color: #2ecc71; }
        .meta-info { display: flex; gap: 12px; margin-bottom: 15px; font-size: 13px; color: #aaa; flex-wrap: wrap; }
        .description { font-size: 14px; line-height: 1.5; color: #ddd; margin-bottom: 15px; }
        .details { font-size: 13px; color: #bbb; margin-bottom: 20px; }
        .details ul { padding-left: 20px; margin: 0; }
        .btn-play { display: block; width: 100%; padding: 14px; background: #e74c3c; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; }
        
        #game-container { 
            display: none; 
            width: 100vw; 
            height: 100vh; 
            position: fixed; 
            top: 0; 
            left: 0; 
            z-index: 99999; 
            background: #000; 
        }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <header id="main-header">
        <span class="badge">KUBO TOUCH</span>
    </header>

    <div id="game-card">
        <div class="cover-container"></div>
        <div class="content">
            <h1>Super Mario World</h1>
            <div class="meta-info">
                <span>🎮 1-2 Jogadores</span>
                <span>📅 1990</span>
                <span>🏢 Nintendo</span>
            </div>

            <p class="description">
                Junte-se a Mario e Luigi na lendária jornada pela Dinosaur Land para resgatar a Princesa Peach e derrotar o malvado Bowser!
            </p>

            <div class="details">
                <ul>
                    <li><strong>🎯 Gênero:</strong> Plataforma / Aventura</li>
                    <li><strong>🕹️ Plataforma:</strong> Super Nintendo (SNES)</li>
                </ul>
            </div>

            <button class="btn-play" onclick="startEmulator()">► JOGAR AGORA</button>
        </div>
    </div>

    <div id="game-container">
        <div id="game"></div>
    </div>

<script>
    function startEmulator() {
        const card = document.getElementById('game-card');
        const container = document.getElementById('game-container');

        if (card) card.style.display = 'none';
        if (container) container.style.display = 'block';

        /* CONFIGURAÇÃO DO EMULADOR */
        window.EJS_player = "#game";
        window.EJS_core = "snes9x2010"; // Usar o núcleo mais leve
        window.EJS_gameName = "Super Mario World";
        window.EJS_color = "#e74c3c";
        window.EJS_startOnLoaded = true;

        /* LINK DIRETO DA ROM DO GITHUB */
        window.EJS_gameUrl = "https://raw.githubusercontent.com/grupoplanejar2024-coder/kubo3D/main/roms/smw.sfc";

        /* FORÇAR USO EXCLUSIVO DO CDN OFICIAL (Evita procurar arquivos locais no seu GitHub) */
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_paths = {
            "snes9x2010": "https://cdn.emulatorjs.org/stable/data/cores/snes9x2010.json"
        };

        /* OTIMIZAÇÕES PARA CELULAR (SEM TRAVAR / SEM SOM ESTOURADO) */
        window.EJS_webgl = true;
        window.EJS_threads = false; // DESATIVA THREADS QUE CAUSAM O SOM ESTOURADO
        window.EJS_multiview = false;
        window.EJS_disableFocusCanvas = true;
        window.EJS_smooth = false;
        window.EJS_mouse = false;

        /* CONFIGURAÇÃO DE ÁUDIO */
        window.EJS_Volume = 0.8;
        window.EJS_Settings = {
            sound: true,
            fps: false
        };

        /* CARREGA O LOADER OFICIAL */
        let script = document.createElement("script");
        script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        script.async = true;
        document.body.appendChild(script);
    }
</script>
